name: Feature Request
description: Suggest a feature (other then mod compat)
labels: ["enhancement"]
assignees: [PssbleTrngle]
projects: [PssbleTrngle/16]

body:
  - type: textarea
    id: idea
    attributes:
      label: Describe the feature you have in mind.
      placeholder: So I was think about...
    validations:
      required: true

  - type: textarea
    id: problem-solving
    attributes:
      label: Does this solve a particular problem?
      placeholder: Yes, it balances...
    validations:
      required: false
